<!DOCTYPE html>
<html lang="id">
<head>
    <meta name="monetag" content="e6b96649098cfea7a9db3672f6fa97da">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapVid - Video Downloader Pro</title>
    <style>
        :root { --primary: #00d2ff; --secondary: #3a7bd5; --dark: #0f172a; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .navbar { width: 100%; padding: 20px; text-align: center; background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); }
        .container { width: 90%; max-width: 600px; margin-top: 50px; text-align: center; padding: 30px; background: rgba(30, 41, 59, 0.7); border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        h1 { font-size: 2.5rem; margin-bottom: 10px; background: linear-gradient(to right, #00d2ff, #3a7bd5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .input-group { margin-top: 30px; position: relative; }
        input { width: 100%; padding: 15px 20px; border-radius: 50px; border: none; background: #334155; color: white; font-size: 1rem; box-sizing: border-box; outline: none; border: 2px solid transparent; transition: 0.3s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 210, 255, 0.3); }
        button { margin-top: 20px; width: 100%; padding: 15px; border-radius: 50px; border: none; background: linear-gradient(to right, #00d2ff, #3a7bd5); color: white; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: transform 0.2s; }
        button:active { transform: scale(0.98); }
        #result { margin-top: 30px; display: none; padding: 20px; background: #1e293b; border-radius: 15px; }
        .loading { display: none; margin-top: 20px; color: var(--primary); }
        .footer { margin-top: auto; padding: 30px; color: #64748b; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="navbar"><strong>SnapVid Pro</strong></div>

    <div class="container">
        <h1>Video Downloader</h1>
        <p>Download video TikTok, Instagram, & FB tanpa watermark</p>
        
        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="Tempel link video di sini...">
            <button onclick="processDownload()">Download Sekarang</button>
        </div>

        <div id="loading" class="loading">Sabar ya, lagi diproses... 🚀</div>

        <div id="result">
            <p>Video Berhasil Ditemukan!</p>
            <a id="downloadBtn" href="#" target="_blank" style="text-decoration: none;">
                <button style="background: #22c55e;">Klik untuk Simpan Video</button>
            </a>
        </div>
    </div>

    <div class="footer">&copy; 2026 SnapVid - Created with ❤️</div>

    <script src="https://quge5.com/88/tag.min.js" data-zone="237124" async data-cfasync="false"></script>

    <script>
        async function processDownload() {
            const url = document.getElementById('videoUrl').value;
            const resDiv = document.getElementById('result');
            const loadDiv = document.getElementById('loading');
            const dlLink = document.getElementById('downloadBtn');

            if (!url) return alert('Masukkan link dulu bos!');

            loadDiv.style.display = 'block';
            resDiv.style.display = 'none';

            try {
                // Kita pakai API publik gratis untuk simulasi/proses (Contoh: Tikwm untuk TikTok)
                const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`);
                const data = await response.json();

                if (data.code === 0) {
                    dlLink.href = data.data.play; // Mengambil link video tanpa watermark
                    resDiv.style.display = 'block';
                } else {
                    alert('Maaf, link tidak didukung atau video privat.');
                }
            } catch (error) {
                alert('Terjadi kesalahan koneksi.');
            } finally {
                loadDiv.style.display = 'none';
            }
        }
    </script>
</body>
</html>
